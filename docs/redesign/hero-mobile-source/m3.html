<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400&family=Archivo:wght@600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f1cfa1;font-family:'Poppins',sans-serif;color:#7a2e1e}
.shadow{position:absolute;left:-60px;top:0;width:1200px;mix-blend-mode:multiply;opacity:1}
.panel{position:absolute;left:0;top:1180px;width:1080px;height:740px;background:#d9b992}
h1{position:absolute;left:70px;top:170px;margin:0;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:118px;line-height:.98;letter-spacing:.005em;color:#7a2e1e}
.frame{position:absolute;left:420px;top:470px;width:590px;height:900px;background:#f3f0ea;padding:14px;box-sizing:border-box;box-shadow:0 26px 60px rgba(90,45,20,.28)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.card{position:absolute;left:250px;width:226px;box-shadow:0 14px 30px rgba(90,45,20,.25)}
.rule{position:absolute;left:70px;width:110px;height:3px;background:#7a2e1e}
.desc{position:absolute;left:70px;right:60px;top:1415px;font-size:35px;line-height:1.75;letter-spacing:.09em;font-weight:300;color:#7a2e1e}
.btn{position:absolute;left:62px;top:1630px;height:96px;padding:0 64px;border-radius:50px;background:#7a2e1e;color:#fff;display:flex;align-items:center;font-family:'Archivo',sans-serif;font-weight:600;font-size:46px;letter-spacing:.1em}
.url{position:absolute;left:150px;top:1290px;transform-origin:0 0;transform:rotate(-90deg);font-size:30px;letter-spacing:.42em;color:#7a2e1e;white-space:nowrap}
</style></head><body><div class="c">
 <img class="shadow" src="assets/b3_shadow.png">
 <div class="panel"></div>
 <h1>ELEGANT IN<br>EVERY MOMENT</h1>
 <div class="rule" style="top:440px"></div>

 <div class="url">www.madalsacouture.com</div>

 <div class="frame"><img src="assets/b3_main.jpg"></div>
 <img class="card" src="assets/b3_card1.png" style="top:520px">
 <img class="card" src="assets/b3_card2.png" style="top:810px">
 <img class="card" src="assets/b3_card3.png" style="top:1100px">

 <div class="desc">A collection that radiates grace and softness. Designed for women who embrace confidence and elegance in every step.</div>
 <div class="btn">BUY NOW</div>
 <div class="rule" style="top:1830px;opacity:0"></div>
</div></body></html>
