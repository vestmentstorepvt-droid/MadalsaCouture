name: CI

# Checks every pull request and push to main on GitHub's own machines.
# Deployment itself is done by Vercel's GitHub integration (preview per PR, production on main).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
        env:
          JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-real-000
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real-111
